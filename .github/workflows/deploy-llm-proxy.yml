name: Deploy LLM Proxy

on:
  push:
    paths:
      - 'cloudflare/llm-proxy/**'
      - '.github/workflows/deploy-llm-proxy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-llm-proxy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare LLM Proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        working-directory: cloudflare/llm-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy