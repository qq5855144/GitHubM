# GitHub Pages 自动部署 + Android APK 构建 + Release 发布工作流
# 推送到 main 分支时：
#   1. 构建 Web 应用（dist/）
#   2. 部署到 GitHub Pages
#   3. 同步部署到 Cloudflare Pages（全球 CDN）
#   4. 打包签名 Release APK（WebView 壳 + dist/ 资源）
#   5. 自动创建 GitHub Release 并上传 APK
#
# ── Secrets 配置说明 ─────────────────────────────────────────────────
# 仓库 Settings → Secrets and variables → Actions 中可配置：
#
#   【签名 Secrets（必需）】
#   RELEASE_KEYSTORE_BASE64   release.keystore 文件的 base64 内容
#   RELEASE_KEY_ALIAS         密钥别名（github-manager）
#   RELEASE_STORE_PASSWORD    keystore 密码
#   RELEASE_KEY_PASSWORD      key 密码
#
#   签名私钥只保存在 GitHub Actions Secrets 中，不再提交到仓库。
#   缺少任意一项时构建会直接失败，避免退回临时证书或仓库内弱签名。
# ────────────────────────────────────────────────────────────────────
name: Deploy & Build APK

on:
  push:
    branches: [main, master]   # 同时监听 main 和 master 分支
  workflow_dispatch: # 支持手动触发

# GITHUB_TOKEN 权限
permissions:
  contents: write   # 创建 GitHub Release 需要 write 权限
  pages: write
  id-token: write

# 同组并发：新部署取消旧部署（仅影响 Pages，APK 构建不受影响）
concurrency:
  group: pages
  cancel-in-progress: true

# 强制 Actions 使用 Node.js 24（2026-06 起官方默认，提前适配避免破坏性变更）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_STATS_API_URL: ${{ vars.VITE_STATS_API_URL }}

# ─────────────────────────────────────────────────────────────────
jobs:

  # ── Job 1：构建 Web 应用 ───────────────────────────────────────
  build-web:
    name: 构建 Web 应用
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 检查签名文件未入库
        run: |
          set -euo pipefail
          FILES=$(git ls-files '*.keystore' '*.jks')
          if [ -n "$FILES" ]; then
            echo "::error::仓库中不允许提交签名文件："
            echo "$FILES"
            exit 1
          fi


      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node.js（含 pnpm 依赖缓存）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm       # pnpm store 缓存；首次约 40s，缓存命中后约 8s

      - name: 移除平台私有依赖（避免 Actions 安装失败）
        run: |
          npm pkg delete dependencies.miaoda-react-devkit || true
          npm pkg delete devDependencies.miaoda-react-devkit || true
          rm -f pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install

      - name: 代码质量检查
        run: |
          npx biome lint
          npx tsgo -p tsconfig.check.json
          pnpm test
      - name: 构建 Web 应用（注入版本号）
        run: |
          # 注入版本号
          export VITE_APP_VERSION="1.0.${{ github.run_number }}"
          export NODE_OPTIONS="--max_old_space_size=6144"
          pnpm exec vite build

      - name: 上传 Web 构建产物（供后续 Job 使用）
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 1

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ── Job 2：部署到 GitHub Pages ─────────────────────────────────
  deploy-pages:
    name: 部署到 GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Job 3：同步部署到 Cloudflare Pages ─────────────────────────
  deploy-cloudflare-pages:
    name: 部署到 Cloudflare Pages
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Web 构建产物
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: 部署到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy web-dist \
            --project-name githubm-web \
            --branch main \
            --commit-dirty=true

  # ── Job 4：构建签名 Release APK 并发布 ────────────────────────
  build-apk:
    name: 构建 Android APK 并发布 Release
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（含 android/ 项目源码）
        uses: actions/checkout@v4

      - name: 下载 Web 构建产物
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: 将 Web 资源复制到 Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/. android/app/src/main/assets/

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Gradle 8.7
        run: |
          set -euo pipefail
          ZIP=/tmp/gradle-8.7-bin.zip
          # gradle 官方下载节点近期频繁 504，优先使用国内镜像，失败再回退官方源。
          if ! curl -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 \
            -o "$ZIP" "https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip"; then
            curl -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 \
              -o "$ZIP" "https://services.gradle.org/distributions/gradle-8.7-bin.zip"
          fi
          rm -rf "$HOME/gradle-8.7"
          unzip -q "$ZIP" -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"
          "$HOME/gradle-8.7/bin/gradle" --version

      - name: 生成 local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 接受 Android SDK 许可证
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # ── 签名配置 ──────────────────────────────────────────────────
      # 签名私钥只从 Actions Secrets 读取；缺失时直接失败，不生成临时证书。
      - name: 配置 Release Keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS:       ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD:  ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD:    ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${GITHUB_WORKSPACE}/android/release.keystore"
          if [ -z "${RELEASE_KEYSTORE_BASE64}" ] || [ -z "${RELEASE_KEY_ALIAS}" ] ||              [ -z "${RELEASE_STORE_PASSWORD}" ] || [ -z "${RELEASE_KEY_PASSWORD}" ]; then
            echo "::error::缺少 Release 签名 Secrets，请配置 RELEASE_KEYSTORE_BASE64 / RELEASE_KEY_ALIAS / RELEASE_STORE_PASSWORD / RELEASE_KEY_PASSWORD"
            exit 1
          fi
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          if [ ! -s "${KEYSTORE_PATH}" ]; then
            echo "::error::Keystore 解码失败"
            exit 1
          fi
          echo "✅ 使用 Actions Secrets 中的 Release Keystore"
          echo "keystore_path=${KEYSTORE_PATH}"   >> "$GITHUB_OUTPUT"
          echo "store_password=${RELEASE_STORE_PASSWORD}" >> "$GITHUB_OUTPUT"
          echo "key_alias=${RELEASE_KEY_ALIAS}"   >> "$GITHUB_OUTPUT"
          echo "key_password=${RELEASE_KEY_PASSWORD}" >> "$GITHUB_OUTPUT"

      # ── 构建签名 Release APK ───────────────────────────────────
      - name: 生成版本号
        id: version
        run: |
          # versionCode 使用 Unix 时间戳（秒），保证「始终递增」：
          # 1) 避免 PR 测试包 versionCode 领先正式包导致降级安装失败；
          # 2) 每次发布都必然大于历史版本，支持跨版本覆盖安装。
          # versionName 仍保持人类可读的 1.0.<run_number>。
          echo "code=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 构建签名 Release APK
        working-directory: android
        env:
          VERSION_CODE:    ${{ steps.version.outputs.code }}
          VERSION_NAME:    ${{ steps.version.outputs.name }}
          KEYSTORE_PATH:   ${{ steps.keystore.outputs.keystore_path }}
          STORE_PASSWORD:  ${{ steps.keystore.outputs.store_password }}
          KEY_ALIAS:       ${{ steps.keystore.outputs.key_alias }}
          KEY_PASSWORD:    ${{ steps.keystore.outputs.key_password }}
        run: gradle assembleRelease --no-daemon

      # ── 规范化 APK 文件名 ──────────────────────────────────────
      - name: 重命名 APK
        id: rename_apk
        run: |
          VERSION_NAME="${{ steps.version.outputs.name }}"
          APK_NAME="github-manager-v${VERSION_NAME}.apk"
          # 始终使用 Release APK（两种签名方案均走 assembleRelease）
          cp "android/app/build/outputs/apk/release/app-release.apk" "${APK_NAME}"
          echo "apk_name=${APK_NAME}"       >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      # ── 创建 GitHub Release 并上传 APK ────────────────────────
      - name: 生成变更日志
        id: changelog
        run: |
          # 获取上一个 Release tag（无则取所有提交）
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" | head -60)
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s")
          fi

          # 按 Conventional Commits 前缀分类
          FEATURES=$(echo "$COMMITS" | grep -E "^feat[:(]"   | sed 's/^feat[:(]/- ✨ /' | sed 's/)$//' || true)
          FIXES=$(echo "$COMMITS"    | grep -E "^fix[:(]"    | sed 's/^fix[:(]/- 🐛 /'  | sed 's/)$//' || true)
          PERF=$(echo "$COMMITS"     | grep -E "^perf[:(]"   | sed 's/^perf[:(]/- ⚡ /' | sed 's/)$//' || true)
          DOCS=$(echo "$COMMITS"     | grep -E "^doc[:(]"    | sed 's/^doc[:(]/- 📖 /'  | sed 's/)$//' || true)
          OTHERS=$(echo "$COMMITS"   | grep -vE "^(feat|fix|perf|doc|chore|test|style|refactor)[:(]" | sed 's/^/- /' | head -10 || true)

          {
            echo "changelog<<EOF"
            [ -n "$FEATURES" ] && echo "### ✨ 新功能"  && echo "$FEATURES" && echo ""
            [ -n "$FIXES"    ] && echo "### 🐛 修复"    && echo "$FIXES"    && echo ""
            [ -n "$PERF"     ] && echo "### ⚡ 性能优化" && echo "$PERF"    && echo ""
            [ -n "$DOCS"     ] && echo "### 📖 文档"    && echo "$DOCS"     && echo ""
            [ -n "$OTHERS"   ] && echo "### 🔧 其他更新" && echo "$OTHERS"  && echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="${{ steps.rename_apk.outputs.version_name }}"
          APK_NAME="${{ steps.rename_apk.outputs.apk_name }}"
          TAG="v${VERSION_NAME}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          SIGN_NOTE="✅ **稳定 Release 签名**（Actions Secrets 托管，可跨版本覆盖安装）"

          NOTES="## GitHub Manager ${TAG}

          **构建信息**
          - 版本号：\`${VERSION_NAME}\`（versionCode: \`${{ steps.version.outputs.code }}\`）
          - 提交：[\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${COMMIT_SHA})
          - 构建时间：$(date -u '+%Y-%m-%d %H:%M UTC')
          - ${SIGN_NOTE}

          ${{ steps.changelog.outputs.changelog }}

          **签名证书变更（${TAG} 起）**
          - 本版本起使用全新的 Release 签名证书
          - 从 v1.0.592 或更早版本升级：请先卸载旧版，再安装本版本
          - 卸载会清除应用内登录状态与 AI 配置，需要重新登录

          **安装方式**
          1. 下载下方 APK 文件到 Android 设备
          2. 允许「安装未知来源应用」后点击安装
          3. 从 v1.0.592 或更早版本升级：必须先卸载旧版，不能直接覆盖安装
          4. 从 ${TAG} 起，后续版本可直接覆盖安装

          **系统要求**
          - Android 8.0（API 26）及以上"
          # 如同名 tag 已存在则先删除（workflow_dispatch 重复触发场景）
          gh release delete "${TAG}" --yes 2>/dev/null || true
          git push origin --delete "${TAG}" 2>/dev/null || true

          gh release create "${TAG}" \
            --title "GitHub Manager ${TAG}" \
            --notes "${NOTES}" \
            --latest \
            "${APK_NAME}"

